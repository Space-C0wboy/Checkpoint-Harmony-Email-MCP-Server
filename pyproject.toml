[project]
name = "checkpoint-harmony-mcp"
version = "0.2.5"
description = "MCP server for the Check Point Harmony Email & Collaboration API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kierston Grantham", email = "Space-C0wboy@users.noreply.github.com" }]
keywords = ["mcp", "checkpoint", "harmony", "avanan", "email-security", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastmcp>=3,<5",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.urls]
Homepage = "https://github.com/Space-C0wboy/Checkpoint-Harmony-Email-MCP-Server"
Repository = "https://github.com/Space-C0wboy/Checkpoint-Harmony-Email-MCP-Server"
Issues = "https://github.com/Space-C0wboy/Checkpoint-Harmony-Email-MCP-Server/issues"

[project.scripts]
checkpoint-harmony-mcp = "checkpoint_harmony_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkpoint_harmony_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.17 also formats code blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # line-too-long: the formatter handles length
    "B008",  # function call in a default argument: the FastMCP/Pydantic Field pattern
]
